# Create the app at https://api.slack.com/apps → "From a manifest", then:
#   1. Basic Information → App-Level Tokens → create one with connections:write  → SLACK_APP_TOKEN (xapp-…)
#   2. Install to workspace → OAuth & Permissions → Bot User OAuth Token          → SLACK_BOT_TOKEN (xoxb-…)
#   3. Invite the bot to each project channel: /invite @tara
display_information:
  name: tara
  description: Claude Code sessions in Slack threads
features:
  bot_user:
    display_name: tara
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - chat:write
      - reactions:write
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
