<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="420" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="16" fill="none" stroke="#1f293d"/>

  <!-- Left: name and tagline -->
  <rect x="64" y="92" width="44" height="44" rx="11" fill="rgba(56,189,248,.12)"/>
  <text x="86" y="122" text-anchor="middle" font-size="22" font-weight="700" fill="#38bdf8">T</text>
  <text x="124" y="126" font-size="40" font-weight="700" fill="#f8fafc">tara-agent</text>
  <text x="64" y="190" font-size="24" fill="#cbd5e1">A 24/7 AI agent that works on your projects</text>
  <text x="64" y="224" font-size="24" fill="#cbd5e1">and asks you before it acts.</text>
  <g font-size="15" fill="#94a3b8">
    <circle cx="70" cy="279" r="4" fill="#10b981"/><text x="84" y="284">Scheduled jobs, day and night</text>
    <circle cx="70" cy="309" r="4" fill="#f59e0b"/><text x="84" y="314">Approve from Slack or the dashboard</text>
    <circle cx="70" cy="339" r="4" fill="#38bdf8"/><text x="84" y="344">Runs Claude Code in your own repos, on your own server</text>
  </g>

  <!-- Right: a Slack thread with an approval card -->
  <rect x="700" y="60" width="516" height="300" rx="14" fill="#111827" stroke="#2e3e5c"/>
  <text x="724" y="92" font-size="13" font-weight="600" fill="#94a3b8"># shop-ops</text>
  <line x1="700" y1="106" x2="1216" y2="106" stroke="#1f293d"/>
  <rect x="724" y="124" width="32" height="32" rx="8" fill="rgba(56,189,248,.12)"/>
  <text x="740" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#38bdf8">T</text>
  <text x="770" y="138" font-size="14" font-weight="700" fill="#f8fafc">tara <tspan font-weight="400" fill="#94a3b8" font-size="12">  APP  9:00 AM</tspan></text>
  <text x="770" y="160" font-size="14" fill="#cbd5e1">Late orders report: 3 orders past their ship date.</text>

  <rect x="770" y="176" width="420" height="150" rx="10" fill="#0d1320" stroke="#1f293d"/>
  <rect x="770" y="176" width="4" height="150" rx="2" fill="#f59e0b"/>
  <text x="790" y="204" font-size="14" font-weight="700" fill="#f8fafc">Refund order #1042 ($38)?</text>
  <text x="790" y="228" font-size="13" fill="#94a3b8">Shipped 9 days late. The customer asked twice.</text>
  <text x="790" y="248" font-size="13" fill="#94a3b8">Draft reply and refund are ready.</text>
  <rect x="790" y="270" width="92" height="34" rx="8" fill="rgba(16,185,129,.15)" stroke="#10b981"/>
  <text x="836" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#10b981">Approve</text>
  <rect x="892" y="270" width="80" height="34" rx="8" fill="none" stroke="#2e3e5c"/>
  <text x="932" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#cbd5e1">Reject</text>
  <rect x="982" y="270" width="80" height="34" rx="8" fill="none" stroke="#2e3e5c"/>
  <text x="1022" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#cbd5e1">Revise</text>
  <text x="724" y="388" font-size="12" fill="#94a3b8">Your tap continues the same Claude session.</text>
</svg>
