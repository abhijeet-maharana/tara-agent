# ~/.config/tara-agent/config.yaml
agentName: tara # what the agent calls itself; match the Slack app's bot name
projects:
  - ~/Projects/my-shop
  - ~/Projects/side-project
concurrency: 2
claude:
  bin: claude
  chatTimeoutMinutes: 20
statusIntervalSeconds: 5
# Code page (/code): uncommitted changes and files of each repo. Default: the projects above.
